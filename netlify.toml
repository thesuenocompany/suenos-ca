[build]
  command = "find . -maxdepth 2 -type f \\( -name 'NETLIFY-HOTLINE-SETUP*.md' -o -name 'NETLIFY-HOTLINE-SETUP*.txt' \\) -delete"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "NETLIFY-HOTLINE-SETUP.md,NETLIFY-HOTLINE-SETUP-FIXED.md"

[functions]
  node_bundler = "esbuild"

# Admin is an operational surface. Always revalidate it so fixes and auth/session
# handling are not stranded behind a stale browser copy.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/assets/js/admin.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/js/contest-admin-20260806-rules.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/js/contest-add-retailer-focus-20260813.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/js/admin-router-stable-20260807.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[redirects]]
  from = "/find-suenos"
  to = "/en-ca/find-a-bottle/"
  status = 301
  force = true

[[redirects]]
  from = "/find-suenos/"
  to = "/en-ca/find-a-bottle/"
  status = 301
  force = true

[[redirects]]
from = "/cocktails/jalisco-haze"
to = "/en-ca/cocktails/jalisco-haze/"
status = 301
force = true

[[redirects]]
from = "/cocktails/jalisco-haze/"
to = "/en-ca/cocktails/jalisco-haze/"
status = 301
force = true

# Existing static cocktail pages keep priority. New recipe slugs use the dynamic recipe shell.
[[redirects]]
  from = "/en-ca/cocktails/:slug/"
  to = "/en-ca/cocktails/recipe/index.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/en-ca/cocktails/:slug"
  to = "/en-ca/cocktails/recipe/index.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/es-mx/cocteles/:slug/"
  to = "/es-mx/cocteles/recipe/index.html?slug=:slug"
  status = 200
  force = false

[[redirects]]
  from = "/es-mx/cocteles/:slug"
  to = "/es-mx/cocteles/recipe/index.html?slug=:slug"
  status = 200
  force = false

# Dynamic contest pages. The slug is loaded by the reusable contest shell.
[[redirects]]
  from = "/en-ca/contests/:slug/"
  to = "/en-ca/contests/contest/index.html?slug=:slug"
  status = 200
  force = true

[[redirects]]
  from = "/en-ca/contests/:slug"
  to = "/en-ca/contests/contest/index.html?slug=:slug"
  status = 200
  force = true
