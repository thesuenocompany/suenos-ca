<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Where to Find Sueños Tequila</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f8f9fa;
    --surface:  #ffffff;
    --border:   #e2e8f0;
    --teal:     #0d9488;
    --teal-lt:  #f0fdfa;
    --teal-md:  #ccfbf1;
    --text:     #1e293b;
    --muted:    #64748b;
    --hover:    #f1f5f9;
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* ── Layout ── */
  #wrap { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  #sidebar {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 2px 0 8px rgba(0,0,0,.06);
  }
  #sidebar-head {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #sidebar-head h2 {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--teal); margin-bottom: 3px;
  }
  #sidebar-head p { font-size: 12px; color: var(--muted); }

  /* Search + nearest button */
  #controls { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
  #search {
    width: 100%; padding: 7px 11px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--teal); }

  #nearest-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 7px 12px;
    background: var(--teal); color: #fff;
    border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #nearest-btn:hover { background: #0f766e; }
  #nearest-btn:disabled { background: #94a3b8; cursor: default; }
  #nearest-btn svg { flex-shrink: 0; }

  /* Type filter chips */
  #type-filter { display: flex; gap: 5px; }
  .chip {
    flex: 1; padding: 6px 8px; text-align: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); }
  .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .chip.on.retail { background: #d97706; border-color: #d97706; }
  .store-type {
    display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: 1px 6px; border-radius: 99px; margin-top: 3px;
  }
  .store-type.retail      { background: #fef3c7; color: #b45309; }
  .store-type.hospitality { background: var(--teal-md); color: #0f766e; }

  /* Store list */
  #store-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
  #store-list::-webkit-scrollbar { width: 4px; }
  #store-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .store-item {
    padding: 9px 11px; border-radius: 8px; cursor: pointer;
    margin-bottom: 3px; border: 1px solid transparent; transition: all .15s;
  }
  .store-item:hover { background: var(--hover); }
  .store-item.active { background: var(--teal-lt); border-color: var(--teal); }
  .store-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .store-addr { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .store-dist { font-size: 11px; color: var(--teal); margin-top: 3px; font-weight: 500; }
  #empty {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 40px 16px; display: none;
  }

  /* ── Map ── */
  #map { flex: 1; position: relative; }

  /* ── Popups ── */
  .leaflet-popup-content-wrapper {
    background: #fff !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.15) !important;
    padding: 0 !important;
  }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip { background: #fff !important; }
  .leaflet-popup-close-button { color: var(--muted) !important; top: 8px !important; right: 10px !important; font-size: 18px !important; }
  .popup-inner { padding: 14px 16px; min-width: 200px; }
  .popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .popup-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 6px; border: 1px solid #e5e7eb; background: #f9fafb; padding: 3px; flex-shrink: 0; }
  .popup-name { font-size: 14px; font-weight: 700; color: var(--teal); padding-right: 16px; }
  .popup-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.5; }
  .popup-row svg { flex-shrink: 0; margin-top: 1px; opacity: .7; }
  .popup-link { color: var(--teal); text-decoration: none; }
  .popup-link:hover { text-decoration: underline; }

  /* ── Mobile ── */
  @media (max-width: 600px) {
    /* Lock the whole page to the viewport — no body scroll */
    html, body { height: 100%; overflow: hidden; }

    #wrap { flex-direction: column; height: 100vh; overflow: hidden; }

    /* Map FIRST — takes the top 52% of the screen */
    #map { order: -1; height: 52vh; min-height: 0; max-height: none; flex: none; }

    /* Sidebar fills the remaining 48% below the map */
    #sidebar {
      order: 0;
      width: 100%; border-right: none;
      border-top: 1px solid var(--border);
      flex: 1; min-height: 0;
      overflow: hidden; flex-shrink: 0;
      display: flex; flex-direction: column;
    }

    /* Hide the title/count header on mobile — saves space, map is already obvious */
    #sidebar-head { display: none; }

    /* Controls row: search + button side by side */
    #controls { flex-direction: row; gap: 6px; padding: 8px 10px; }
    #search { flex: 1; }
    #nearest-btn { flex-shrink: 0; white-space: nowrap; width: auto; padding: 7px 10px; font-size: 11px; }

    /* List fills remaining space and scrolls internally */
    #store-list { flex: 1; overflow-y: auto; max-height: none; padding: 4px 8px 8px; }
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="sidebar">
    <div id="sidebar-head">
      <h2>Sueños Tequila</h2>
      <p id="count-label">Loading locations…</p>
    </div>
    <div id="controls">
      <div id="type-filter">
        <button class="chip on" data-cat="all"         onclick="setTypeFilter('all', this)">All</button>
        <button class="chip retail" data-cat="retail"  onclick="setTypeFilter('retail', this)">🛒 Retail Stores</button>
        <button class="chip" data-cat="hospitality"    onclick="setTypeFilter('hospitality', this)">🍹 Bars &amp; Restaurants</button>
      </div>
      <input id="search" type="text" placeholder="Search by name or city…" autocomplete="off"/>
      <button id="nearest-btn" onclick="findNearest()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Find my nearest location
      </button>
    </div>
    <div id="store-list"></div>
    <div id="empty">No locations match your search.</div>
  </div>
  <div id="map"></div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://dowfjjthshbbgnvwxzjv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd2ZqanRoc2hiYmdudnd4emp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzMxNjMsImV4cCI6MjA5NjI0OTE2M30.KnXWIp7BXqoxTv2-os77_7FphL5ZVn1XbB1HTwbxKsU';
// ─────────────────────────────────────────────────────────────────────────────

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// OpenStreetMap tile layer (no API key required)
const map = L.map('map', { zoomControl: true, attributionControl: true })
              .setView([56, -96], 4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
  maxZoom: 19,
}).addTo(map);

// Category: retail (liquor/grocery stores) vs hospitality (bars, restaurants, hotels, clubs)
function category(s) {
  const t = (s.type || '').toLowerCase();
  return (t.includes('liquor') || t.includes('store') || t.includes('retail') || t.includes('grocery')) ? 'retail' : 'hospitality';
}
const CAT_LABEL = { retail: 'Retail Store', hospitality: 'Bar / Restaurant' };

// Pin icon — drop-pin colored by category (teal = hospitality, amber = retail)
function pinIcon(active, cat) {
  const isRetail = cat === 'retail';
  const c      = active ? (isRetail ? '#d97706' : '#0d9488') : (isRetail ? '#fbbf24' : '#5eead4');
  const stroke = active ? '#fff' : (isRetail ? '#b45309' : '#0f766e');
  return L.divIcon({
    className: '',
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30">
      <path d="M11 0C4.9 0 0 4.9 0 11c0 7.7 11 19 11 19s11-11.3 11-19C22 4.9 17.1 0 11 0z" fill="${c}" stroke="${stroke}" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="4" fill="#fff" opacity=".95"/>
    </svg>`,
    iconSize:    [22, 30],
    iconAnchor:  [11, 30],
    popupAnchor: [0, -32],
  });
}

// Logo pin — circular logo badge with a pointer underneath
function logoPin(logoUrl, active, cat) {
  const isRetail = cat === 'retail';
  const border = active ? (isRetail ? '#d97706' : '#0d9488') : (isRetail ? '#f59e0b' : '#14b8a6');
  const shadow = active ? '0 2px 6px rgba(0,0,0,.35)' : '0 2px 4px rgba(0,0,0,.2)';
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:40px;display:flex;flex-direction:column;align-items:center;">
      <div style="width:40px;height:40px;border-radius:50%;border:2.5px solid ${border};background:#fff;overflow:hidden;box-shadow:${shadow};display:flex;align-items:center;justify-content:center;">
        <img src="${logoUrl}" style="width:34px;height:34px;object-fit:contain;" onerror="this.parentElement.parentElement.parentElement.innerHTML=''">
      </div>
      <svg width="12" height="8" viewBox="0 0 12 8" style="margin-top:-1px;display:block;">
        <polygon points="0,0 12,0 6,8" fill="${border}"/>
      </svg>
    </div>`,
    iconSize:    [40, 48],
    iconAnchor:  [20, 48],
    popupAnchor: [0, -50],
  });
}

// User location marker
let userMarker = null;

let allStores = [];
let markers   = {};
let activeId  = null;

// ── Load ──────────────────────────────────────────────────────────────────────
async function load() {
  const { data, error } = await sb
    .from('accounts')
    .select('id, name, type, address, lat, lng, phone, website, logo_url')
    .eq('status', 'Listed')
    .not('lat', 'is', null)
    .not('lng', 'is', null)
    .order('name');

  if (error) { console.error('[StoreLocator]', error); return; }
  allStores = data || [];
  renderAll(allStores);
}

// ── Render markers + list ─────────────────────────────────────────────────────
function renderAll(list, highlightId) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  document.getElementById('store-list').innerHTML = '';
  document.getElementById('empty').style.display = 'none';
  activeId = null;

  document.getElementById('count-label').textContent =
    list.length ? `${list.length} location${list.length !== 1 ? 's' : ''} carrying Sueños` : 'No locations found';

  if (!list.length) {
    document.getElementById('empty').style.display = 'block';
    return;
  }

  const bounds = [];

  list.forEach(s => {
    const isHighlight = s.id === highlightId;
    const cat = category(s);
    const icon = s.logo_url ? logoPin(s.logo_url, isHighlight, cat) : pinIcon(isHighlight, cat);
    const m = L.marker([s.lat, s.lng], { icon });
    m.bindPopup(makePopup(s), { maxWidth: 260, minWidth: 200 });
    m.addTo(map);
    m.on('click', () => setActive(s.id, false));
    markers[s.id] = m;
    bounds.push([s.lat, s.lng]);

    const el = document.createElement('div');
    el.className = 'store-item' + (isHighlight ? ' active' : '');
    el.id = `item-${s.id}`;
    el.innerHTML = `<div class="store-name">${esc(s.name)}</div>`
      + (s.address ? `<div class="store-addr">${esc(s.address)}</div>` : '')
      + `<span class="store-type ${cat}">${cat === 'retail' ? '🛒 Retail Store' : '🍹 Bar / Restaurant'}</span>`
      + (s._dist   ? `<div class="store-dist">📍 ${s._dist} km away</div>` : '');
    el.addEventListener('click', () => {
      setActive(s.id, true);
      map.setView([s.lat, s.lng], 14, { animate: true });
      markers[s.id]?.openPopup();
    });
    document.getElementById('store-list').appendChild(el);
  });

  if (highlightId) {
    setActive(highlightId, true);
    const hit = list.find(s => s.id === highlightId);
    if (hit) { map.setView([hit.lat, hit.lng], 13, { animate: true }); markers[hit.id]?.openPopup(); }
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 13);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
  }
}

function makePopup(s) {
  let h = `<div class="popup-inner">`;
  h += `<div class="popup-header">`;
  if (s.logo_url) h += `<img class="popup-logo" src="${esc(s.logo_url)}" alt="${esc(s.name)} logo" onerror="this.style.display='none'">`;
  h += `<div><div class="popup-name">${esc(s.name)}</div>`;
  const cat = category(s);
  h += `<span class="store-type ${cat}">${cat === 'retail' ? '🛒 Retail Store' : '🍹 Bar / Restaurant'}</span></div>`;
  h += `</div>`;
  if (s.address) h += `<div class="popup-row">${ico('pin')} <span>${esc(s.address)}</span></div>`;
  if (s.phone)   h += `<div class="popup-row">${ico('phone')} <a href="tel:${esc(s.phone)}" class="popup-link">${esc(s.phone)}</a></div>`;
  if (s.website) {
    const url = /^https?:\/\//i.test(s.website) ? s.website : 'https://' + s.website;
    h += `<div class="popup-row">${ico('globe')} <a href="${url}" target="_blank" rel="noopener" class="popup-link">Visit website</a></div>`;
  }
  h += `</div>`;
  return h;
}

function storeById(id) { return allStores.find(s => s.id === id); }
function iconFor(s, active) { const c = category(s||{}); return s?.logo_url ? logoPin(s.logo_url, active, c) : pinIcon(active, c); }

// ── Type filter ───────────────────────────────────────────────────────────────
let typeFilter = 'all';
function setTypeFilter(cat, btn) {
  typeFilter = cat;
  document.querySelectorAll('#type-filter .chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  applyFilters();
  trackEvent({ event_type: 'search', query: `[filter] ${cat}` });
}
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  let list = allStores;
  if (typeFilter !== 'all') list = list.filter(s => category(s) === typeFilter);
  if (q) list = list.filter(s =>
    (s.name || '').toLowerCase().includes(q) ||
    (s.address || '').toLowerCase().includes(q)
  );
  renderAll(list);
}

function setActive(id, scrollList) {
  if (activeId) {
    document.getElementById(`item-${activeId}`)?.classList.remove('active');
    if (markers[activeId]) markers[activeId].setIcon(iconFor(storeById(activeId), false));
  }
  activeId = id;
  document.getElementById(`item-${id}`)?.classList.add('active');
  if (markers[id]) markers[id].setIcon(iconFor(storeById(id), true));
  if (scrollList) document.getElementById(`item-${id}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const s = storeById(id);
  if (s) trackEvent({ event_type: 'click', account_id: s.id, account_name: s.name });
}

// ── Find nearest ──────────────────────────────────────────────────────────────
function findNearest() {
  if (!navigator.geolocation) {
    alert('Your browser does not support location access.');
    return;
  }
  const btn = document.getElementById('nearest-btn');
  btn.disabled = true;
  btn.textContent = 'Locating…';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: uy, longitude: ux } = pos.coords;

      // Drop a user pin
      if (userMarker) map.removeLayer(userMarker);
      userMarker = L.circleMarker([uy, ux], {
        radius: 7, fillColor: '#3b82f6', color: '#fff', weight: 2, fillOpacity: 1,
      }).addTo(map).bindPopup('You are here').openPopup();

      // Sort stores by distance (respecting the active type filter)
      const pool = typeFilter === 'all' ? allStores : allStores.filter(s => category(s) === typeFilter);
      const withDist = pool.map(s => {
        const d = haversine(uy, ux, s.lat, s.lng);
        return { ...s, _dist: d.toFixed(1) };
      }).sort((a, b) => parseFloat(a._dist) - parseFloat(b._dist));

      renderAll(withDist, withDist[0]?.id);

      btn.disabled = false;
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Find my nearest location`;
    },
    err => {
      btn.disabled = false;
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg> Find my nearest location`;
      if (err.code === 1) alert('Location access was denied. Please allow location in your browser settings.');
      else alert('Could not determine your location. Please try again.');
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

// Haversine distance in km
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function rad(d) { return d * Math.PI / 180; }

// ── Analytics ─────────────────────────────────────────────────────────────────
async function trackEvent(payload) {
  try { await sb.from('map_analytics').insert(payload); } catch(e) { /* silent */ }
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchDebounce = null;
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  applyFilters();
  // Track after 800ms pause, min 2 chars
  clearTimeout(searchDebounce);
  if (q.length >= 2) {
    searchDebounce = setTimeout(() => {
      trackEvent({ event_type: 'search', query: q });
    }, 800);
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function ico(type) {
  const i = {
    pin:   `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
    phone: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.72A2 2 0 012 .88h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.9a16 16 0 006.29 6.29l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>`,
    globe: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>`,
  };
  return i[type] || '';
}

load();
</script>
</body>
</html>
