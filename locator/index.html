<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Where to Find Sueños Tequila</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f8f9fa;
    --surface:  #ffffff;
    --border:   #e2e8f0;
    --teal:     #0d9488;
    --teal-lt:  #f0fdfa;
    --teal-md:  #ccfbf1;
    --text:     #1e293b;
    --muted:    #64748b;
    --hover:    #f1f5f9;
  }

  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* ── Layout ── */
  #wrap { display: flex; height: 100vh; }

  /* ── Sidebar ── */
  #sidebar {
    width: 300px; flex-shrink: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 2px 0 8px rgba(0,0,0,.06);
  }
  #sidebar-head {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #sidebar-head h2 {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--teal); margin-bottom: 3px;
  }
  #sidebar-head p { font-size: 12px; color: var(--muted); }

  /* Search + nearest button */
  #controls { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
  #search {
    width: 100%; padding: 7px 11px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--teal); }

  #nearest-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 7px 12px;
    background: var(--teal); color: #fff;
    border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #nearest-btn:hover { background: #0f766e; }
  #nearest-btn:disabled { background: #94a3b8; cursor: default; }
  #nearest-btn svg { flex-shrink: 0; }

  /* Type filter chips */
  #type-filter { display: flex; gap: 5px; }
  .chip {
    flex: 1; padding: 6px 8px; text-align: center;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; font-size: 11px; font-weight: 600; color: var(--muted);
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .chip:hover { border-color: var(--teal); color: var(--teal); }
  .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
  .chip.on.retail { background: #d97706; border-color: #d97706; }
  .store-type {
    display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .05em; padding: 1px 6px; border-radius: 99px; margin-top: 3px;
  }
  .store-type.retail      { background: #fef3c7; color: #b45309; }
  .store-type.hospitality { background: var(--teal-md); color: #0f766e; }

  /* Store list */
  #store-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
  #store-list::-webkit-scrollbar { width: 4px; }
  #store-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .store-item {
    padding: 9px 11px; border-radius: 8px; cursor: pointer;
    margin-bottom: 3px; border: 1px solid transparent; transition: all .15s;
  }
  .store-item:hover { background: var(--hover); }
  .store-item.active { background: var(--teal-lt); border-color: var(--teal); }
  .store-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .store-addr { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .store-dist { font-size: 11px; color: var(--teal); margin-top: 3px; font-weight: 500; }
  #empty {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 40px 16px; display: none;
  }

  /* ── Map ── */
  #map { flex: 1; position: relative; }

  /* ── Popups ── */
  .leaflet-popup-content-wrapper {
    background: #fff !important;
    color: var(--text) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.15) !important;
    padding: 0 !important;
  }
  .leaflet-popup-content { margin: 0 !important; }
  .leaflet-popup-tip { background: #fff !important; }
  .leaflet-popup-close-button { color: var(--muted) !important; top: 8px !important; right: 10px !important; font-size: 18px !important; }
  .popup-inner { padding: 14px 16px; min-width: 200px; }
  .popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .popup-logo { width: 40px; height: 40px; object-fit: contain; border-radius: 6px; border: 1px solid #e5e7eb; background: #f9fafb; padding: 3px; flex-shrink: 0; }
  .popup-name { font-size: 14px; font-weight: 700; color: var(--teal); padding-right: 16px; }
  .popup-row { display: flex; align-items: flex-start; gap: 7px; font-size: 12px; color: var(--muted); margin-bottom: 5px; line-height: 1.5; }
  .popup-row svg { flex-shrink: 0; margin-top: 1px; opacity: .7; }
  .popup-link { color: var(--teal); text-decoration: none; }
  .popup-link:hover { text-decoration: underline; }

  .locator-actions { display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:5px; }
  .locator-actions a { min-height:44px; display:inline-flex; align-items:center; padding:0 5px; color:#0f766e; font-size:13px; }
  .locator-actions a.primary { font-weight:700; }
  #search, #nearest-btn, .chip, #map-toggle { min-height:44px; font-size:14px; }
  #map-toggle { display:none; }
  #map.unavailable { display:none; }
  #empty button { min-height:44px; margin-top:8px; padding:0 10px; cursor:pointer; }
  #store-list:empty { display:none; }
  @media (max-width: 600px) {
    #wrap { flex-direction:column; overflow:hidden; }
    #sidebar { width:100%; border:0; flex:1; min-height:0; z-index:1; }
    #sidebar-head { padding:9px 12px; }
    #controls { gap:5px; padding:7px 10px; }
    #mobile-options { display:flex; gap:6px; }
    #nearest-btn, #map-toggle { flex:1; }
    #map-toggle:not([hidden]) { display:block; }
    #map { display:none; }
    #wrap.mobile-map #map:not(.unavailable) { display:block; flex:none; height:38%; }
    .store-name { font-size:15px; }
    .store-addr { font-size:13px; }
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="sidebar">
    <div id="sidebar-head">
      <h2>Sueños Tequila</h2>
      <p id="count-label" role="status">Loading locations…</p>
    </div>
    <div id="controls">
      <div id="type-filter">
        <button type="button" class="chip on retail" data-cat="retail" aria-pressed="true">Buy a bottle</button>
        <button type="button" class="chip" data-cat="hospitality" aria-pressed="false">Find a pour</button>
      </div>
      <input id="search" type="search" aria-label="Search by name, city or postal code" placeholder="Name, city or postal code" autocomplete="off"/>
      <div id="mobile-options">
        <button type="button" id="nearest-btn">Use my location</button>
        <button type="button" class="chip" id="map-toggle" aria-controls="map" aria-expanded="false">Show map</button>
      </div>
    </div>
    <div id="store-list"></div>
    <div id="empty"><p id="empty-message"></p><button id="clear-search" type="button" class="chip" hidden>Clear search</button></div>
  </div>
  <div id="map"></div>
</div>

<script src="/assets/js/locator-actions.js"></script>
<script type="module">
import { actionsFor, category, visibleStores, hasPin, normalizeSearch } from "/assets/js/locator-rules.js?v=1";
// ── CONFIG ────────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://dowfjjthshbbgnvwxzjv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvd2ZqanRoc2hiYmdudnd4emp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NzMxNjMsImV4cCI6MjA5NjI0OTE2M30.KnXWIp7BXqoxTv2-os77_7FphL5ZVn1XbB1HTwbxKsU';
// ─────────────────────────────────────────────────────────────────────────────

const sb = window.supabase?.createClient(SUPABASE_URL, SUPABASE_KEY);
const market = new URLSearchParams(location.search).get('market') === 'mx' ? 'mx' : 'ca';
const es = market === 'mx';
document.documentElement.lang = es ? 'es-MX' : 'en-CA';
const copy = es ? {
  loading:'Cargando establecimientos…', buy:'Comprar una botella', pour:'Encontrar un bar',
  search:'Nombre, ciudad o código postal', locate:'Usar mi ubicación', locating:'Buscando ubicación…',
  show:'Ver mapa', hide:'Ocultar mapa', clear:'Borrar búsqueda', retail:'Tienda', hospitality:'Bar o restaurante',
  directions:'Cómo llegar', call:'Llamar', website:'Sitio web', here:'Estás aquí', distance:'km de distancia',
  noSearch:'Sin resultados. Prueba con el nombre, una ciudad cercana o un código postal.',
  noResults:'Por ahora no hay establecimientos en esta categoría. Prueba la otra opción o vuelve más tarde.',
  badLoad:'No pudimos cargar los establecimientos. Vuelve a intentarlo en un momento.',
  unavailable:'Directorio no disponible', geoError:'No pudimos acceder a tu ubicación. Busca por ciudad o código postal.',
  count:n=>n===1?'1 establecimiento en México':`${n} establecimientos en México`
} : {
  loading:'Loading locations…', buy:'Buy a bottle', pour:'Find a pour',
  search:'Name, city or postal code', locate:'Use my location', locating:'Locating…',
  show:'Show map', hide:'Hide map', clear:'Clear search', retail:'Retail store', hospitality:'Bar or restaurant',
  directions:'Directions', call:'Call', website:'Website', here:'You are here', distance:'km away',
  noSearch:'No matches. Try a nearby city, a store name, or a different postal code.',
  noResults:'No listed locations in this category right now. Try the other option or check back later.',
  badLoad:'Could not load current locations. Please try again shortly.',
  unavailable:'Locator unavailable', geoError:'Couldn’t get your location. You can still search by city or postal code.',
  count:n=>n===1?'1 location in Canada':`${n} locations in Canada`
};
const $ = id => document.getElementById(id);
const setCopy=(id,value)=> { $(id).textContent=value; };
setCopy('count-label',copy.loading);
setCopy('nearest-btn',copy.locate); setCopy('map-toggle',copy.show); setCopy('clear-search',copy.clear);
$('search').placeholder=copy.search; $('search').setAttribute('aria-label',copy.search);
document.querySelector('[data-cat="retail"]').textContent=copy.buy;
document.querySelector('[data-cat="hospitality"]').textContent=copy.pour;
if(es) document.title='Dónde encontrar tequila Sueños en México';

let map = null;
try {
  if (window.L) {
    map = L.map('map', { zoomControl: true, attributionControl: true })
      .setView(es ? [23.5,-102] : [56,-96], 4);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
      maxZoom: 19
    }).addTo(map);
  }
} catch { map = null; }
if (!map) { $('map').classList.add('unavailable'); $('map-toggle').hidden=true; }
$('map-toggle').addEventListener('click',()=>{
  const showing=$('wrap').classList.toggle('mobile-map');
  $('map-toggle').setAttribute('aria-expanded',String(showing));
  setCopy('map-toggle',showing?copy.hide:copy.show);
  if (showing) { map?.invalidateSize(); drawBounds(latestBounds); }
});
$('nearest-btn').addEventListener('click',findNearest);
$('clear-search').addEventListener('click',()=>{ $('search').value=''; $('search').focus(); applyFilters(); });
document.querySelectorAll('#type-filter .chip').forEach(btn=>btn.addEventListener('click',()=>setTypeFilter(btn.dataset.cat,btn)));

// Pin icon — drop-pin colored by category (teal = hospitality, amber = retail)
function pinIcon(active, cat) {
  const isRetail = cat === 'retail';
  const c      = active ? (isRetail ? '#d97706' : '#0d9488') : (isRetail ? '#fbbf24' : '#5eead4');
  const stroke = active ? '#fff' : (isRetail ? '#b45309' : '#0f766e');
  return L.divIcon({
    className: '',
    html: `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30">
      <path d="M11 0C4.9 0 0 4.9 0 11c0 7.7 11 19 11 19s11-11.3 11-19C22 4.9 17.1 0 11 0z" fill="${c}" stroke="${stroke}" stroke-width="1.5"/>
      <circle cx="11" cy="11" r="4" fill="#fff" opacity=".95"/>
    </svg>`,
    iconSize:    [22, 30],
    iconAnchor:  [11, 30],
    popupAnchor: [0, -32],
  });
}

// Logo pin — circular logo badge with a pointer underneath
function logoPin(logoUrl, active, cat) {
  const isRetail = cat === 'retail';
  const border = active ? (isRetail ? '#d97706' : '#0d9488') : (isRetail ? '#f59e0b' : '#14b8a6');
  const shadow = active ? '0 2px 6px rgba(0,0,0,.35)' : '0 2px 4px rgba(0,0,0,.2)';
  return L.divIcon({
    className: '',
    html: `<div style="position:relative;width:40px;display:flex;flex-direction:column;align-items:center;">
      <div style="width:40px;height:40px;border-radius:50%;border:2.5px solid ${border};background:#fff;overflow:hidden;box-shadow:${shadow};display:flex;align-items:center;justify-content:center;">
        <img src="${logoUrl}" style="width:34px;height:34px;object-fit:contain;" onerror="this.parentElement.parentElement.parentElement.innerHTML=''">
      </div>
      <svg width="12" height="8" viewBox="0 0 12 8" style="margin-top:-1px;display:block;">
        <polygon points="0,0 12,0 6,8" fill="${border}"/>
      </svg>
    </div>`,
    iconSize:    [40, 48],
    iconAnchor:  [20, 48],
    popupAnchor: [0, -50],
  });
}

// User location marker
let userMarker = null;

let allStores = [];
let markers = Object.create(null);
let latestBounds = [];
let userLocation = null;
let activeId  = null;

// ── Load ──────────────────────────────────────────────────────────────────────
let loading = false;
let loadFailed = false;
async function load() {
  if (loading) return;
  loading = true;
  try {
    const response = await fetch('/api/public-stockists', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('Retailer source unavailable');
    const data = await response.json();
    if (!Array.isArray(data.stores)) throw new Error('Invalid retailer response');
    allStores = data.stores;
    loadFailed = false;
    applyFilters();
  } catch {
    allStores = [];
    loadFailed = true;
    renderAll([]);
  } finally { loading = false; }
}
// Refresh current status on return and once per minute while visible.
window.addEventListener('pageshow', event => { if (event.persisted) load(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 60000);

// ── Render markers + list ─────────────────────────────────────────────────────
function renderActions(store) {
  const links = actionsFor(store), cat=category(store);
  return '<div class="locator-actions">' +
    ['directions','call','website'].filter(key=>links[key]).map(key=>
      `<a ${key==='directions'?'class="primary" ':''}href="${esc(links[key])}" ${key==='call'?'':'target="_blank" rel="noopener noreferrer" '}` +
      `aria-label="${esc(copy[key] + ' – ' + store.name)}" data-retailer-action="${key}" data-retailer-id="${esc(store.id)}" data-venue-type="${cat}">${copy[key]}</a>`
    ).join('') + '</div>';
}
function drawBounds(bounds) {
  if (!map || !bounds.length) return;
  if (bounds.length === 1) map.setView(bounds[0], 13);
  else map.fitBounds(bounds, { padding: [35, 35], maxZoom: 13 });
}
function renderAll(list) {
  Object.values(markers).forEach(m => map?.removeLayer(m));
  markers = Object.create(null);
  $('store-list').innerHTML = '';
  $('empty').style.display = 'none';
  activeId = null;
  latestBounds = [];
  setCopy('count-label',loadFailed ? copy.unavailable : copy.count(list.length));
  if (!list.length) {
    $('empty').style.display = 'block';
    const searched = !!normalizeSearch($('search').value);
    setCopy('empty-message', loadFailed ? copy.badLoad : searched ? copy.noSearch : copy.noResults);
    $('clear-search').hidden=loadFailed || !searched;
    return;
  }
  list.forEach(s => {
    const cat = category(s);
    const address = s.address || [s.city,s.province].filter(Boolean).join(', ');
    if (map && hasPin(s) && s.address) {
      const marker = L.marker([s.lat, s.lng], { icon: iconFor(s, false) });
      marker.bindPopup(`<div class="popup-inner"><div class="popup-name">${esc(s.name)}</div><p class="store-addr">${esc(address)}</p>${renderActions(s)}</div>`, { maxWidth: 270, minWidth: 200 });
      marker.addTo(map).on('click', () => setActive(s.id, true));
      markers[s.id] = marker;
      latestBounds.push([s.lat, s.lng]);
    }
    const el = document.createElement('article');
    el.className = 'store-item';
    el.id = `item-${s.id}`;
    el.innerHTML = `<h3 class="store-name">${esc(s.name)}</h3>`
      + (address ? `<div class="store-addr">${esc(address)}</div>` : '')
      + `<span class="store-type ${cat}">${copy[cat]}</span>`
      + (s._dist ? `<div class="store-dist">${s._dist} ${copy.distance}</div>` : '')
      + renderActions(s);
    if (markers[s.id]) el.addEventListener('click', event => {
      if (event.target.closest('a')) return;
      setActive(s.id, false);
      if (getComputedStyle($('map')).display !== 'none') {
        map.setView([s.lat, s.lng], 14);
        markers[s.id]?.openPopup();
      }
    });
    $('store-list').appendChild(el);
  });
  if (map && getComputedStyle($('map')).display !== 'none') drawBounds(latestBounds);
}

function storeById(id) { return allStores.find(s => s.id === id); }
function iconFor(s, active) { const c = category(s||{}); return s?.logo_url ? logoPin(esc(s.logo_url), active, c) : pinIcon(active, c); }

// ── Type filter ───────────────────────────────────────────────────────────────
let typeFilter = 'retail';
function setTypeFilter(cat, btn) {
  typeFilter = cat;
  document.querySelectorAll('#type-filter .chip').forEach(chip=>{
    chip.classList.toggle('on',chip===btn);
    chip.setAttribute('aria-pressed',String(chip===btn));
  });
  applyFilters();
  trackEvent({ event_type: 'search', query: `[filter] ${cat}` });
}
function applyFilters() {
  let list = visibleStores(allStores, {country:market,type:typeFilter,query:$('search').value});
  if (userLocation) {
    const {latitude,longitude}=userLocation;
    list = list.map(s => ({...s, km: hasPin(s) && s.address ? haversine(latitude,longitude,s.lat,s.lng) : Infinity}))
      .sort((a,b)=>a.km-b.km).map(s=>({...s, _dist:Number.isFinite(s.km)?s.km.toFixed(1):''}));
  }
  renderAll(list);
}

function setActive(id, scrollList) {
  if (activeId) {
    document.getElementById(`item-${activeId}`)?.classList.remove('active');
    if (markers[activeId]) markers[activeId].setIcon(iconFor(storeById(activeId), false));
  }
  activeId = id;
  document.getElementById(`item-${id}`)?.classList.add('active');
  if (markers[id]) markers[id].setIcon(iconFor(storeById(id), true));
  if (scrollList) document.getElementById(`item-${id}`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  const s = storeById(id);
  if (s) trackEvent({ event_type: 'click', account_id: s.id, account_name: s.name });
}

// ── Find nearest ──────────────────────────────────────────────────────────────
function findNearest() {
  if (!navigator.geolocation) { alert(copy.geoError); return; }
  const btn=$('nearest-btn');
  btn.disabled=true;
  setCopy('nearest-btn',copy.locating);
  navigator.geolocation.getCurrentPosition(pos=>{
    userLocation=pos.coords;
    if (map) {
      if (userMarker) map.removeLayer(userMarker);
      userMarker=L.circleMarker([pos.coords.latitude,pos.coords.longitude],{
        radius:7,fillColor:'#3b82f6',color:'#fff',weight:2,fillOpacity:1
      }).addTo(map).bindPopup(copy.here);
    }
    applyFilters();
    btn.disabled=false; setCopy('nearest-btn',copy.locate);
  },()=>{
    btn.disabled=false; setCopy('nearest-btn',copy.locate); alert(copy.geoError);
  },{ timeout:10000,maximumAge:60000 });
}
// Haversine distance in km
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = rad(lat2 - lat1), dLon = rad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function rad(d) { return d * Math.PI / 180; }

// ── Analytics ─────────────────────────────────────────────────────────────────
async function trackEvent(payload) {
  try { await sb?.from('map_analytics').insert(payload); } catch(e) { /* silent */ }
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchDebounce = null;
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  applyFilters();
  // Track after 800ms pause, min 2 chars
  clearTimeout(searchDebounce);
  if (q.length >= 2) {
    searchDebounce = setTimeout(() => {
      trackEvent({ event_type: 'search', query: q });
    }, 800);
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
load();
</script>
</body>
</html>
